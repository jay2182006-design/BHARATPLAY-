<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BHARATPLAY — India Creates. India Watches.</title>
    <meta name="description" content="India Creates. India Watches. A creator-first Indian video streaming, Bharat Shorts, live broadcasting, Watch Party, and community platform." />
    <meta property="og:title" content="BHARATPLAY — India Creates. India Watches." />
    <meta property="og:description" content="India Creates. India Watches. A creator-first Indian video streaming, Bharat Shorts, live broadcasting, Watch Party, and community platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bharatplay_theme');
          var mode = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var root = document.documentElement;
          if (mode === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#09090B] text-zinc-900 dark:text-white antialiased selection:bg-[#E11D48]/30 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
